<!DOCTYPE html>
<html lang="zh-CN" data-ha-style="document">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>canvas-design — 视觉艺术创作 Skill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #a03b00;
      --primary-container: #c94c00;
      --primary-fixed: #ffdbcd;
      --primary-fixed-dim: #ffb597;
      --on-primary: #ffffff;
      --accent-glow: #E8400D;
      --secondary: #d5baff;
      --secondary-container: #7b40e0;
      --tertiary: #4d44e3;
      --accent-cyan: #00D4FF;
      --bg: #fff8f6;
      --surface: #fff8f6;
      --surface-container-lowest: #ffffff;
      --surface-container-low: #fbf2ef;
      --surface-container: #f5ece9;
      --surface-container-high: #efe6e3;
      --fg-1: #1e1b19;
      --fg-2: #594138;
      --fg-muted: #8d7166;
      --border: rgba(0, 0, 0, 0.06);
      --border-strong: rgba(0, 0, 0, 0.12);
      --outline-variant: #e1bfb2;
      --green: #10b981;
      --blue: #3b82f6;
      --yellow: #f59e0b;
      --red: #ef4444;
      --font-headline: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'SF Mono', 'Menlo', ui-monospace, monospace;
      --space-xs: 4px; --space-sm: 8px; --space-md: 12px;
      --space-lg: 16px; --space-xl: 20px; --space-2xl: 24px;
      --space-3xl: 32px; --space-4xl: 48px; --space-5xl: 64px;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
      --radius-xl: 20px; --radius-2xl: 28px; --radius-pill: 9999px;
      --shadow-sm: 0 1px 2px rgba(30, 27, 25, 0.04);
      --shadow-md: 0 4px 12px rgba(30, 27, 25, 0.08);
      --shadow-lg: 0 8px 24px rgba(30, 27, 25, 0.12);
      --shadow-accent: 0 8px 24px rgba(160, 59, 0, 0.15);
      --gradient-primary: linear-gradient(135deg, #a03b00 0%, #c94c00 100%);
      --gradient-hero: linear-gradient(135deg, #a03b00 0%, #7b40e0 100%);
      --gradient-text: linear-gradient(135deg, #a03b00 0%, #7b40e0 100%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #060B18;
        --surface: #0B1426;
        --surface-container-lowest: #101D35;
        --surface-container-low: #101D35;
        --surface-container: #162544;
        --surface-container-high: #1c2d52;
        --fg-1: #F8FAFC;
        --fg-2: #CBD5E1;
        --fg-muted: #64748B;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.14);
        --primary: #FF6B35;
        --accent-glow: #00D4FF;
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg-1);
      line-height: 1.6;
      font-size: 15px;
    }

    /* Document Shell */
    .document-shell {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--space-3xl) var(--space-xl);
    }

    /* Cover / Masthead */
    .cover {
      margin-bottom: var(--space-4xl);
      padding-bottom: var(--space-3xl);
      border-bottom: 1px solid var(--border-strong);
    }

    .cover-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-xs) var(--space-md);
      background: var(--surface-container);
      border-radius: var(--radius-pill);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-lg);
    }

    .cover-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
    }

    .cover h1 {
      font-family: var(--font-headline);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: var(--space-md);
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .cover-subtitle {
      font-size: 1.125rem;
      color: var(--fg-2);
      font-weight: 400;
      max-width: 640px;
    }

    .deck {
      margin-top: var(--space-2xl);
      padding: var(--space-xl);
      background: var(--surface-container-low);
      border-radius: var(--radius-lg);
      border-left: 4px solid var(--primary);
    }

    .deck-label {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--fg-muted);
      margin-bottom: var(--space-sm);
    }

    .deck p {
      color: var(--fg-2);
      font-size: 15px;
      line-height: 1.65;
    }

    /* Reader Rail */
    .reader-rail {
      display: flex;
      gap: var(--space-xs);
      margin-bottom: var(--space-3xl);
      padding: var(--space-xs);
      background: var(--surface-container);
      border-radius: var(--radius-md);
      overflow-x: auto;
    }

    .rail-tab {
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--radius-sm);
      font-family: var(--font-headline);
      font-size: 13px;
      font-weight: 500;
      color: var(--fg-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      border: none;
      background: transparent;
    }

    .rail-tab:hover {
      color: var(--fg-2);
      background: var(--surface-container-high);
    }

    .rail-tab.active {
      color: var(--on-primary);
      background: var(--gradient-primary);
    }

    /* Body Sections */
    .body-section {
      margin-bottom: var(--space-4xl);
    }

    .section-header {
      display: flex;
      align-items: baseline;
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
      padding-bottom: var(--space-md);
      border-bottom: 1px solid var(--border);
    }

    .section-header h2 {
      font-family: var(--font-headline);
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .section-number {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--fg-muted);
      font-weight: 500;
    }

    .section-body {
      color: var(--fg-2);
      line-height: 1.7;
    }

    .section-body p {
      margin-bottom: var(--space-lg);
    }

    /* Lists */
    .feature-list {
      list-style: none;
      padding: 0;
      margin: var(--space-xl) 0;
    }

    .feature-list li {
      position: relative;
      padding-left: var(--space-xl);
      margin-bottom: var(--space-md);
      color: var(--fg-2);
    }

    .feature-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 6px;
      height: 6px;
      background: var(--primary);
      border-radius: 50%;
    }

    .feature-list strong {
      color: var(--fg-1);
      font-weight: 600;
    }

    /* Claim Cards */
    .claim-card {
      background: var(--surface-container-low);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      margin-bottom: var(--space-lg);
      border: 1px solid var(--border);
    }

    .claim-card h4 {
      font-family: var(--font-headline);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: var(--space-sm);
      color: var(--fg-1);
    }

    .claim-card p {
      color: var(--fg-2);
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }

    /* Process Steps */
    .process-flow {
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
      margin: var(--space-xl) 0;
    }

    .process-step {
      display: flex;
      gap: var(--space-lg);
      align-items: flex-start;
    }

    .step-marker {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      background: var(--gradient-primary);
      color: var(--on-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: 14px;
    }

    .step-content h4 {
      font-family: var(--font-headline);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: var(--space-xs);
    }

    .step-content p {
      color: var(--fg-2);
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }

    /* Table */
    .design-table {
      width: 100%;
      border-collapse: collapse;
      margin: var(--space-xl) 0;
      font-size: 14px;
    }

    .design-table thead th {
      text-align: left;
      padding: var(--space-md) var(--space-lg);
      font-family: var(--font-headline);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--fg-muted);
      background: var(--surface-container);
      border-bottom: 2px solid var(--border-strong);
    }

    .design-table tbody td {
      padding: var(--space-md) var(--space-lg);
      border-bottom: 1px solid var(--border);
      color: var(--fg-2);
      vertical-align: top;
    }

    .design-table tbody tr:hover {
      background: var(--surface-container-low);
    }

    .design-table td:first-child {
      font-weight: 600;
      color: var(--fg-1);
    }

    /* Evidence Margin */
    .evidence-margin {
      margin: var(--space-2xl) 0;
      padding: var(--space-xl);
      background: var(--surface-container);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }

    .evidence-label {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--fg-muted);
      margin-bottom: var(--space-md);
    }

    .evidence-label::before {
      content: "";
      width: 12px;
      height: 2px;
      background: var(--primary);
    }

    /* Caveat Box */
    .caveat-box {
      margin: var(--space-2xl) 0;
      padding: var(--space-xl);
      background: linear-gradient(135deg, rgba(160, 59, 0, 0.06) 0%, rgba(123, 64, 224, 0.04) 100%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--outline-variant);
    }

    .caveat-box h4 {
      font-family: var(--font-headline);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: var(--space-sm);
      color: var(--primary);
    }

    .caveat-box p {
      color: var(--fg-2);
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }

    /* Meta Info */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-lg);
      margin-top: var(--space-2xl);
    }

    .meta-item {
      padding: var(--space-lg);
      background: var(--surface-container-low);
      border-radius: var(--radius-md);
    }

    .meta-key {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--fg-muted);
      margin-bottom: var(--space-xs);
    }

    .meta-value {
      font-size: 14px;
      color: var(--fg-2);
      font-weight: 500;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .document-shell {
        padding: var(--space-xl) var(--space-lg);
      }

      .cover h1 {
        font-size: 1.75rem;
      }

      .process-step {
        gap: var(--space-md);
      }

      .design-table {
        font-size: 13px;
      }

      .design-table thead th,
      .design-table tbody td {
        padding: var(--space-sm);
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .rail-tab {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="document-shell">
    <!-- Cover / Masthead -->
    <header class="cover">
      <div class="cover-badge">Skill Document</div>
      <h1>canvas-design</h1>
      <p class="cover-subtitle">通过「设计哲学 + 视觉表达」的两步法，创建原创的视觉艺术作品。强调空间、形式、色彩、构图等视觉语言，将文本信息压缩到 10% 以内。</p>

      <div class="deck">
        <div class="deck-label">核心定位</div>
        <p>canvas-design 是一个专注于纯视觉艺术创作的 Claude Skill，区别于信息图表或数据可视化，它通过「设计哲学先行」的方法论，确保每一次输出都具有独特的美学运动和大师级工艺感。</p>
      </div>
    </header>

    <!-- Reader Rail -->
    <nav class="reader-rail" role="tablist" aria-label="文档章节导航">
      <button class="rail-tab active" role="tab" aria-selected="true" onclick="scrollToSection('overview')">概览</button>
      <button class="rail-tab" role="tab" aria-selected="false" onclick="scrollToSection('capabilities')">核心能力</button>
      <button class="rail-tab" role="tab" aria-selected="false" onclick="scrollToSection('workflow')">工作流程</button>
      <button class="rail-tab" role="tab" aria-selected="false" onclick="scrollToSection('examples')">设计示例</button>
      <button class="rail-tab" role="tab" aria-selected="false" onclick="scrollToSection('integration')'>集成建议</button>
    </nav>

    <!-- Body Sections -->
    <main>
      <!-- Overview Section -->
      <section class="body-section" id="overview">
        <div class="section-header">
          <span class="section-number">01</span>
          <h2>触发时机与适用范围</h2>
        </div>
        <div class="section-body">
          <p>canvas-design 适用于需要高度原创性和视觉冲击力的场景。当用户要求「有设计感」「像设计师做的」视觉输出时，这个 Skill 能够提供超越模板化生成的艺术品质。</p>

          <ul class="feature-list">
            <li><strong>适用场景：</strong>海报设计、视觉艺术创作、品牌静态素材、活动主视觉</li>
            <li><strong>不适用场景：</strong>需要大量文字说明的信息图、纯数据图表、技术文档插图</li>
            <li><strong>核心原则：</strong>90% 视觉 + 10% 文本，文字仅作为视觉元素而非说明段落</li>
          </ul>

          <div class="caveat-box">
            <h4>原创性保障</h4>
            <p>明确禁止复制现有艺术家作品，避免版权风险。每个作品都应基于独特的设计哲学生成，确保原创性和艺术价值。</p>
          </div>
        </div>
      </section>

      <!-- Capabilities Section -->
      <section class="body-section" id="capabilities">
        <div class="section-header">
          <span class="section-number">02</span>
          <h2>核心能力</h2>
        </div>
        <div class="section-body">
          <div class="claim-card">
            <h4>设计哲学生成</h4>
            <p>为每次创作定义一个独特的「美学运动」（如 "Brutalist Joy"、"Chromatic Silence"），撰写 4-6 段视觉宣言，涵盖空间与形式、色彩与材质、尺度与节奏、构图与平衡等维度。</p>
          </div>

          <div class="claim-card">
            <h4>视觉优先表达</h4>
            <p>最终作品 90% 为视觉设计，10% 为必要文本。文字作为视觉元素而非说明段落，通过空间、形式、色彩传递信息。</p>
          </div>

          <div class="claim-card">
            <h4>多格式输出</h4>
            <p>支持 .png 和 .pdf 格式输出，满足不同场景的使用需求。PNG 适用于数字展示，PDF 适用于印刷和高精度输出。</p>
          </div>

          <div class="claim-card">
            <h4>大师级工艺感</h4>
            <p>反复强调作品应看起来像是经过无数小时精心打磨的，每个细节都应体现专业设计师的 craftsmanship。</p>
          </div>
        </div>
      </section>

      <!-- Workflow Section -->
      <section class="body-section" id="workflow">
        <div class="section-header">
          <span class="section-number">03</span>
          <h2>指令流程</h2>
        </div>
        <div class="section-body">
          <p>canvas-design 采用「两步法」工作流程，确保设计哲学与视觉表达的一致性和高质量。</p>

          <div class="process-flow">
            <div class="process-step">
              <div class="step-marker">1</div>
              <div class="step-content">
                <h4>创建设计哲学（.md 文件）</h4>
                <p>命名运动（1-2 个词），撰写视觉宣言（空间与形式、色彩与材质、尺度与节奏、构图与平衡），反复强调「大师级工艺感」。</p>
              </div>
            </div>

            <div class="process-step">
              <div class="step-marker">2</div>
              <div class="step-content">
                <h4>视觉表达（.png 或 .pdf 文件）</h4>
                <p>接收设计哲学，通过画布将其实现为视觉作品。信息通过空间、形式、色彩传递，而非段落。</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Examples Section -->
      <section class="body-section" id="examples">
        <div class="section-header">
          <span class="section-number">04</span>
          <h2>设计哲学示例</h2>
        </div>
        <div class="section-body">
          <p>下表展示了五种不同的美学运动及其核心理念和视觉表达方式。每种运动都代表了一种独特的视觉语言和创作方法论。</p>

          <table class="design-table">
            <thead>
              <tr>
                <th>运动名称</th>
                <th>核心理念</th>
                <th>视觉表达</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Concrete Poetry</td>
                <td>通过纪念碑式形式和粗体几何传递信息</td>
                <td>巨大色块、雕塑感排版、粗野主义空间分割</td>
              </tr>
              <tr>
                <td>Chromatic Language</td>
                <td>色彩作为主要信息系统</td>
                <td>几何精度、色彩区域创建意义、极简标签</td>
              </tr>
              <tr>
                <td>Analog Meditation</td>
                <td>通过纹理和呼吸空间进行安静的视觉沉思</td>
                <td>纸张纹理、墨水晕染、大量负空间</td>
              </tr>
              <tr>
                <td>Organic Systems</td>
                <td>自然聚集和模块化生长模式</td>
                <td>有机形态、自然色彩、空间关系图</td>
              </tr>
              <tr>
                <td>Geometric Silence</td>
                <td>纯粹的秩序与克制</td>
                <td>网格精度、大胆摄影、瑞士形式主义</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Integration Section -->
      <section class="body-section" id="integration">
        <div class="section-header">
          <span class="section-number">05</span>
          <h2>与 ys-powers 的关联</h2>
        </div>
        <div class="section-body">
          <p>canvas-design 的方法论对 ys-powers 项目具有重要的借鉴价值，特别是在视觉输出质量和设计哲学系统化方面。</p>

          <div class="evidence-margin">
            <div class="evidence-label">差异化分析</div>
            <p>ys-powers 的 <strong>html-anything</strong> 也生成视觉输出，但 canvas-design 更专注于「纯视觉艺术」而非「信息呈现」。其「设计哲学先行」的方法论值得借鉴，可纳入任何需要高质量视觉输出的 skill 中。</p>
          </div>

          <div class="evidence-margin">
            <div class="evidence-label">借鉴价值</div>
            <p>「设计哲学 → 视觉表达」的两步法可纳入任何需要高质量视觉输出的 skill 中；反 AI slop 的理念与 artifacts-builder 一脉相承。</p>
          </div>

          <div class="evidence-margin">
            <div class="evidence-label">搬运建议</div>
            <p>若 ys-powers 有品牌设计、海报生成等场景，值得搬运或改编 canvas-design 的方法论，以提升视觉输出的艺术性和原创性。</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Meta Footer -->
    <footer class="meta-grid">
      <div class="meta-item">
        <div class="meta-key">来源</div>
        <div class="meta-value">refer/awesome-claude-skills/canvas-design/SKILL.md</div>
      </div>
      <div class="meta-item">
        <div class="meta-key">维护者</div>
        <div class="meta-value">Composio / 社区</div>
      </div>
      <div class="meta-item">
        <div class="meta-key">许可证</div>
        <div class="meta-value">Apache 2.0</div>
      </div>
    </footer>
  </div>

  <script>
    // Simple tab navigation
    function scrollToSection(id) {
      const section = document.getElementById(id);
      if (section) {
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });

        // Update active tab
        document.querySelectorAll('.rail-tab').forEach(tab => {
          tab.classList.remove('active');
          tab.setAttribute('aria-selected', 'false');
        });
        event.target.classList.add('active');
        event.target.setAttribute('aria-selected', 'true');
      }
    }

    // Intersection Observer for scroll spy
    const sections = document.querySelectorAll('.body-section');
    const tabs = document.querySelectorAll('.rail-tab');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id;
          tabs.forEach((tab, index) => {
            const sectionIds = ['overview', 'capabilities', 'workflow', 'examples', 'integration'];
            if (sectionIds[index] === id) {
              tab.classList.add('active');
              tab.setAttribute('aria-selected', 'true');
            } else {
              tab.classList.remove('active');
              tab.setAttribute('aria-selected', 'false');
            }
          });
        }
      });
    }, { rootMargin: '-20% 0px -60% 0px' });

    sections.forEach(section => observer.observe(section));
  </script>
</body>
